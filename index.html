<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>أداة الرسم المكانى المهنية - دقة الزوايا</title>
  <link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1a73e8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght=400;500;700&family=Inter:wght=400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Turf.js/6.5.0/turf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.20.9/proj4.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.1/tesseract.min.js"></script>
<script src="https://unpkg.com/dxf-parser@1.1.2/dist/dxf-parser.js"></script>
<script src="https://unpkg.com/shpjs@6.2.0/dist/shp.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<!-- CSV Importer Scripts -->
<script src="csv-importer.js"></script>
<script src="csv-import-button.js"></script>
<style>
  :root{
    --bg:#f8f9fa;
    --bg-panel:#ffffff; --bg-panel-2:#edf2f7;
    --accent:#2563eb; --accent-soft:rgba(37,99,235,.16);
    --teal:#1d4ed8; --teal-soft:rgba(29,78,216,.15);
    --text:#2d3748; --text-muted:#8B9686; --danger:#B5533F; --border:#e2e8f0;
    --mono:'JetBrains Mono', ui-monospace, Consolas, monospace;
    --sans:'Inter', system-ui, -apple-system, sans-serif;
  }
  /* ── الوضع الداكن — نفس أسماء المتغيرات، قيم مختلفة بس، فمفيش أي تعديل لازم في باقي الـ CSS ── */
  [data-theme="dark"]{
    --bg:#2d3748;
    --bg-panel:#1a202c; --bg-panel-2:#4a5568;
    --accent:#3b82f6; --accent-soft:rgba(59,130,246,.18);
    --teal:#60a5fa; --teal-soft:rgba(96,165,250,.15);
    --text:#f7fafc; --text-muted:#a0aec0; --danger:#f56565; --border:#4a5568;
  }
  #themeToggleBtn{--tc:#3b82f6;}
  [data-theme="dark"] .toolbar{background:hsl(218 80% 2%);}
  [data-theme="dark"] .ribbon-tabs{background:hsl(218 80% 2%);}
  [data-theme="dark"] .sidebar, [data-theme="dark"] .rect-hud, [data-theme="dark"] .panel{background:var(--bg-panel);}
  [data-theme="dark"] .leaflet-container{background:#0f1420;}
  /* أيقونات التراجع/الإعادة كانت باهتة على خلفية الشريط الغامقة جدًا في الوضع الداكن — لونها أوضح هنا */
  [data-theme="dark"] #undoBtn, [data-theme="dark"] #redoBtn{color:#cbd5e1;}
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;height:100dvh;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden;}
  .app{display:flex;flex-direction:column;height:100vh;height:100dvh;width:100vw;}
  .body-row{display:flex;flex-direction:row;flex:1;min-height:0;min-width:0;}

  .toolbar{
    width:100%;
    background:linear-gradient(180deg,#ffffff 0%,#edf2f7 100%);
    border-bottom:1px solid var(--border);
    box-shadow:0 2px 18px rgba(0,120,140,.18);
    display:flex;flex-direction:column;align-items:stretch;
    flex-shrink:0;z-index:500;
  }
  /* ── شريط تبويبات الريبون (خريطة / إدراج / تحليل / عرض) ── */
  .ribbon-tabs{display:flex;flex-direction:row;gap:2px;padding:6px 14px 0;}
  .ribbon-tab{
    background:transparent;border:none;border-radius:8px 8px 0 0;padding:7px 18px;
    font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--text-muted);
    cursor:pointer;transition:all .15s;
  }
  .ribbon-tab:hover{color:var(--teal);background:rgba(0,180,166,.1);}
  .ribbon-tab.active{color:var(--accent);background:var(--bg-panel);box-shadow:0 -2px 8px rgba(0,0,0,.06);}
  .ribbon-panels{background:var(--bg-panel);border-top:1px solid var(--border);}
  .ribbon-panel{display:none;flex-direction:row;align-items:stretch;padding:6px 10px;gap:4px;overflow-x:auto;}
  .ribbon-panel.active{display:flex;}
  .ribbon-group{display:flex;flex-direction:column;align-items:center;padding:2px 10px;gap:4px;flex-shrink:0;}
  .ribbon-group + .ribbon-group{border-right:1px solid var(--border);}
  .ribbon-group-row{display:flex;flex-direction:row;gap:2px;flex:1;align-items:center;}
  .ribbon-group-caption{font-size:9.5px;color:var(--text-muted);font-family:var(--sans);white-space:nowrap;margin-top:auto;}

  .toolbar::-webkit-scrollbar{width:3px;}
  .toolbar::-webkit-scrollbar-track{background:transparent;}
  .toolbar::-webkit-scrollbar-thumb{background:rgba(0,180,166,.35);border-radius:3px;}
  .tool-btn{
    width:54px;height:52px;border-radius:12px;border:1px solid transparent;
    background:transparent;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:2px;cursor:pointer;flex-shrink:0;
    color:color-mix(in srgb,var(--tc,var(--text-muted)) 72%,transparent);
    transition:all .2s cubic-bezier(.25,.8,.25,1);
  }
  .tool-btn svg{
    width:20px;height:20px;stroke:currentColor;fill:none;
    stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:inherit;
  }
  .tool-btn span{font-size:7.5px;font-family:var(--sans);font-weight:500;letter-spacing:.01em;}
  .ribbon-group-row .tool-btn{width:46px;height:44px;}
  .ribbon-group-row .tool-btn svg{width:17px;height:17px;}
  .ribbon-group-row .tool-btn span{font-size:6.8px;}

  /* ── Per-tool accent colors — Mediterranean palette ── */
  .tool-btn[data-tool="select"]  {--tc:#1d4ed8;}
  #multiSelectBtn {--tc:#2563eb;}
  .tool-btn[data-tool="point"]   {--tc:#2563eb;}
  .tool-btn[data-tool="line"]    {--tc:#0090A8;}
  .tool-btn[data-tool="polygon"] {--tc:#E8A432;}
  .tool-btn[data-tool="rectangle"]{--tc:#D4852A;}
  .tool-btn[data-tool="circle"]  {--tc:#5070C8;}
  .tool-btn[data-tool="measure"] {--tc:#D4A020;}
  #goToCoordsBtn {--tc:#1d4ed8;}
  #undoBtn,#redoBtn{--tc:#6B7F72;}
  #snapBtn   {--tc:#D4A020;}
  #snapSettingsBtn{--tc:#D4A020;}
  #locateBtn {--tc:#2563eb;}
  #preciseLocateBtn {--tc:#2a9d5c;}
  #fitBtn    {--tc:#1d4ed8;}
  #exportBtn {--tc:#1d4ed8;}
  #importBtn {--tc:#D4A020;}
  #csvImportBtn {--tc:#E8A432;}
  #labelsBtn {--tc:#5070C8;}
  #dimensionsBtn {--tc:#1d4ed8;}
  #screenshotBtn{--tc:#6B7F72;}
  #searchPlaceBtn{--tc:#E8A432;}
  #polygonDmsBtn {--tc:#7B68EE;}
  #pointUtmBtn {--tc:#2a9d5c;}
  .pu-mode-btn.active, .pu-geo-fmt-btn.active{ background:#2a9d5c; border-color:#2a9d5c; color:#fff; }
  .pd-ocr-lang-btn.active{ background:#7B68EE; border-color:#7B68EE; color:#fff; }
  .search-hud{width:310px;border-color:var(--gold);}
  .search-input-row{display:flex;gap:6px;margin-top:4px;}
  .search-input-row input{flex:1;background:var(--bg-panel-2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 8px;font-family:var(--mono);font-size:12px;}
  .search-input-row button{border:none;background:var(--gold);color:#fff;font-size:12px;font-weight:600;padding:6px 10px;border-radius:6px;cursor:pointer;white-space:nowrap;}
  .search-results{max-height:190px;overflow-y:auto;margin-top:8px;display:flex;flex-direction:column;gap:4px;}
  .search-result-item{padding:7px 9px;border-radius:7px;cursor:pointer;font-size:11.5px;border:1px solid var(--border);background:var(--bg-panel-2);line-height:1.4;transition:all .12s;}
  .search-result-item:hover{background:var(--teal-soft);border-color:var(--teal);color:var(--teal);}
  .search-result-item .sr-name{font-weight:600;}
  .search-result-item .sr-type{font-size:10px;color:var(--text-muted);margin-top:1px;}
  .search-empty{text-align:center;color:var(--text-muted);font-size:11.5px;padding:14px 0;}
  .search-loading{text-align:center;color:var(--teal);font-size:11.5px;padding:14px 0;}
  .tool-btn[data-tool="divide"]{--tc:#2a9d5c;}
  .tool-btn[data-tool="divideline"]{--tc:#7c3aed;}
  .tool-btn[data-tool="vertices2pts"]{--tc:#0891b2;}
  .tool-btn[data-tool="split"]{--tc:#c0392b;}
  .tool-btn[data-tool="difference"]{--tc:#8e44ad;}
  .tool-btn[data-tool="buffer"]{--tc:#16a085;}
  .lo-dir-btn{flex:1;padding:8px 6px;border:1px solid var(--border);background:var(--bg-panel-2);color:var(--text-muted);border-radius:6px;cursor:pointer;font-size:12px;font-family:var(--sans);}
  .lo-dir-btn.active{background:#0891b2;border-color:#0891b2;color:#fff;font-weight:700;}
  .tool-btn[data-tool="lineoffset"]{--tc:#0891b2;}


  .tool-btn:hover:not(:disabled){
    color:var(--tc, var(--teal));
    background:color-mix(in srgb,var(--tc,var(--teal)) 14%,transparent);
    border-color:color-mix(in srgb,var(--tc,var(--teal)) 35%,transparent);
    transform:translateY(-1px);
  }
  .tool-btn.active{
    color:var(--tc, var(--accent));
    background:color-mix(in srgb,var(--tc,var(--accent)) 18%,transparent);
    border-color:color-mix(in srgb,var(--tc,var(--accent)) 60%,transparent);
    box-shadow:0 0 16px color-mix(in srgb,var(--tc,var(--accent)) 22%,transparent),
               0 2px 8px rgba(0,0,0,.1);
  }
  .tool-btn:disabled{opacity:0.28;cursor:not-allowed;}
  .toolbar-sep{width:38px;height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent);margin:2px 0;flex-shrink:0;}

  .main{flex:1;position:relative;display:flex;flex-direction:column;min-width:0;}
  .canvas-wrap{flex:1;position:relative;overflow:hidden;}
  #map{width:100%;height:100%;background:#f8f9fa;}
  #map.tool-select{cursor:default;}
  #map.tool-draw{cursor:crosshair;}

</style>
</head>
<body>
<div class="app">

  <div class="toolbar" id="toolbar">

    <div class="ribbon-tabs" id="ribbonTabs">
      <button class="ribbon-tab active" data-ribbon-tab="map">خريطة</button>
      <button class="ribbon-tab" data-ribbon-tab="insert">إدراج</button>
      <button class="ribbon-tab" data-ribbon-tab="analysis">تحليل</button>
      <button class="ribbon-tab" data-ribbon-tab="view">عرض</button>
      <button class="tool-btn" id="themeToggleBtn" title="تبديل الوضع الداكن / الفاتح" style="margin-inline-start:auto;width:auto;height:30px;flex-direction:row;padding:0 10px;">
        <svg viewBox="0 0 24 24" style="width:15px;height:15px;">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke-width="1.8"/>
        </svg><span style="font-size:10.5px;">الوضع الداكن</span>
      </button>
    </div>

    <div class="ribbon-panels" id="ribbonPanels">

      <!-- ══════ تبويب: خريطة ══════ -->
      <div class="ribbon-panel active" data-ribbon-panel="map">

        <div class="ribbon-group">
          <div class="ribbon-group-row">
            <button class="tool-btn" id="exportBtn" title="حفظ كملف GeoJSON">
              <svg viewBox="0 0 24 24">
                <path d="M12 4v13" stroke-width="2.3"/>
                <path d="M7 12l5 5 5-5" stroke-width="2.3"/>
                <rect x="3" y="18" width="18" height="3.5" rx="1.5" fill="currentColor" opacity=".22" stroke-width="1.4"/>
              </svg><span>تصدير</span>
            </button>
            <input type="file" id="csvImportFileInput" accept=".csv,.txt" style="display:none;">
            <button class="tool-btn" id="csvImportBtn" title="استيراد نقاط من CSV (Total Station)">
              <svg viewBox="0 0 24 24">
                <path d="M12 15.5V2.5" stroke-width="2.3"/>
                <path d="M7 7l5-5 5 5" stroke-width="2.3"/>
                <rect x="3" y="18" width="18" height="3.5" rx="1.5" fill="currentColor" opacity=".22" stroke-width="1.4"/>
                <path d="M8 10h8M8 13h8M8 16h5" stroke-width="1.5" opacity=".6"/>
              </svg><span>CSV</span>
            </button>
            <button class="tool-btn" id="importBtn" title="استيراد ملف: GeoJSON / KML / KMZ / DXF (أوتوكاد) / Shapefile (.zip)">
              <svg viewBox="0 0 24 24">
                <path d="M12 15.5V2.5" stroke-width="2.3"/>
                <path d="M7 7l5-5 5 5" stroke-width="2.3"/>
                <rect x="3" y="18" width="18" height="3.5" rx="1.5" fill="currentColor" opacity=".22" stroke-width="1.4"/>
              </svg><span>استيراد</span>
            </button>
          </div>
          <div class="ribbon-group-caption">البيانات</div>
        </div>

      </div>

    </div>

  </div>

  <div class="main" id="main">
    <div class="canvas-wrap" id="canvasWrap">
      <div id="map"></div>
    </div>
  </div>

</div>

<script>
// Initialize when page loads
document.addEventListener('DOMContentLoaded', function() {
  console.log('Page loaded - CSV Importer is ready');
});
</script>

</body>
</html>
